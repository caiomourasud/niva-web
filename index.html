<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/niva-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Deliberadamente SEM `viewport-fit=cover`. Medido no iPhone instalado: o
       iOS entrega à página 793pt numa tela de 852, das duas formas. Com `cover`
       + `black-translucent` esses 793 ficam em y=0 — o topo fica perfeito, mas
       sobram 59pt no rodapé que NÃO pertencem à página (quem pinta ali é o iOS,
       o Flutter não alcança). Sem `cover`, os mesmos 793 ficam em y=59 e o
       rodapé fecha certo. As duas coisas são excludentes; escolhemos o rodapé,
       igual a vibra-web e duoverse-web. A cor da faixa de cima é resolvida pela
       meta `theme-color` (ver abaixo e web_page_theme). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Niva — the garden that lives with you. Cuidado de plantas para a família toda.">

  <!-- A ÚNICA meta `theme-color` da página é criada aqui, por script.
       No iOS com o app instalado a cor da faixa do relógio é decidida no
       lançamento, e tudo indica que ele fixa na PRIMEIRA meta que enxerga: com
       duas metas estáticas por `prefers-color-scheme` e o script substituindo
       depois, a faixa continuava seguindo o SISTEMA. Sem metas estáticas, a
       primeira que existe já é a correta.
       A cor vem de `niva.chrome`, gravada pelo web_page_theme com a última cor
       que o app aplicou — cobre também `themeMode.system` e mantém a paleta só
       no AppTheme. Na primeiríssima abertura ainda não há nada salvo, então
       caímos no tema do sistema, que é o melhor palpite disponível. -->
  <script>
    (function () {
      var c = null, err = null, raw = null;
      try { raw = localStorage.getItem('niva.chrome'); c = raw; }
      catch (e) { err = String(e); }
      window.__nivaBoot = {raw: raw, err: err};
      if (!c) {
        c = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? '#2A2B2B'   // AppTheme.dark.scaffold
          : '#EBF1F1';  // AppTheme.light.scaffold
      }
      var m = document.createElement('meta');
      m.name = 'theme-color';
      m.content = c;
      document.head.appendChild(m);
      document.documentElement.style.backgroundColor = c;
      window.__nivaBoot.applied = c;
    })();
  </script>

  <!-- "Adicionar à Tela de Início" no iOS. `default`, não `black-translucent`:
       translucent é o par do `viewport-fit=cover` e traz junto os 59pt mortos
       no rodapé (ver o comentário do viewport), além de pintar o relógio sempre
       claro — ilegível sobre um topo claro. Com `default` o iOS reserva a faixa,
       escolhe uma cor legível para o relógio e a pinta com a `theme-color`.
       O rodapé (home indicator) fica com o PhoneSafeArea do phone_frame. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Niva">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon: PNG pequeno + variantes grandes para a aba ficar nítida em retina. -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png"/>

  <title>Niva</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* A página atrás da view do Flutter. Mesma cor do fundo do app para as
       faixas em volta nunca piscarem branco antes do primeiro frame. */
    /* `100vh`, NÃO `100%`: com `viewport-fit=cover` + `black-translucent` o
       `100%` não contabiliza a área atrás da status bar, o documento sai menor
       que a tela e sobra uma faixa do fundo no rodapé. `100vh` já é a tela
       inteira aqui — somar `env(safe-area-inset-top)` por cima passa do
       visível e joga a barra de navegação para fora da borda de baixo. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #EBF1F1;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #2A2B2B; }
    }
    /* Sem o flash cinza do toque, que denuncia que é uma página e não um app. */
    html, body { -webkit-tap-highlight-color: transparent; }

    /* Hospeda a view do Flutter. Com host próprio o engine mede ESTE elemento
       (ResizeObserver) em vez de `documentElement.clientHeight`. Mesma altura do
       documento: `100vh`, sem somas. */
    #flutter-host {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100vh;
    }

  </style>
</head>

  <script>
    // Desregistra qualquer service worker antigo desta origem.
    //
    // O build sai com `--pwa-strategy=none`, mas um SW já instalado continua
    // servindo o `index.html` em cache — e foi isso que fez correções deste
    // arquivo simplesmente não chegarem ao aparelho, levando a conclusões
    // erradas sobre o que funcionava. Sem SW, cada abertura busca o HTML atual
    // (o GitHub Pages responde com ETag). O custo é não ter cache offline.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
  </script>
  <script>
    // O engine do Flutter remove TODA meta viewport e escreve a dele, sem
    // `viewport-fit`. Este observer devolve o `cover` no instante em que a meta
    // dele aparece — sem isso o app não recebe a área do relógio.
    new MutationObserver(function () {
      var m = document.querySelector('meta[name="viewport"]');
      if (m && m.content.indexOf('viewport-fit') === -1) {
        m.content += ', viewport-fit=cover';
      }
    }).observe(document.head, {childList: true, subtree: true, attributes: true});
  </script>
